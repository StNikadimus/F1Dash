# Linux server overlay - only these values change compared with main/config/config.toml
# (the shared defaults, also used by the Windows "pc variant"). Applied by server/launch.sh
# (F1DASH_CONFIG_OVERLAY) / main.py --overlay.

[server]
host = "0.0.0.0"            # reachable from the TV, the PC with VOYO and the phone
port = 8080
# https://<server>/tv and /disk - once server/make-https-cert.sh made a certificate (http stays on 8080)
https_port = 443

[f1_tv]
# a headless server has no browser to open: sign in through an SSH tunnel (server/README.md)
open_browser = false

[sync]
# the VOYO window and its playback-clock bridge (tools/voyo_clock.py) run on the PC / TV box that
# shows VOYO, not on this server: accept their samples from the LAN. Set [remote] token below
# (or F1DASH_REMOTE_TOKEN) so only your launcher may post them.
allow_remote_clock = true

[voyo.recording]
# VOYO stream recordings go to the external disk mounted at /mnt/f1disk (server/README.md
# "External USB hard drive"). Until a disk is mounted there, recording waits (logged, re-checked
# every 60 s) and nothing is written to the system disk; after mounting, it starts by itself and
# creates the voyo_streams folder on the disk. Another mount point: change both lines.
path = "/mnt/f1disk/voyo_streams"
require_mount = "/mnt/f1disk"
# the file /mnt/f1disk/.f1disk must exist on the disk (SETUP.md step 4) - needed in a Proxmox container
mount_marker = ".f1disk"
# Intel Quick Sync (HD 530 of the i5-6300HQ): the GPU encodes the recording, the 2 cores stay free
capture_encoder = "vaapi"
# other examples:
# path = "/mnt/data/f1-voyo-streams"          # data disk
# path = "/var/lib/f1-dashboard/voyo_streams" # system data dir (then require_mount = "")
# record_video_capture = true                 # opt-in window capture by the PC that shows VOYO

[voyo.server_player]
# picture size of the recording; if `htop` shows 100 % CPU during a recording: "1280x720"
resolution = "1920x1080"
# the server opens VOYO itself around every F1 session and records it - no PC needed
# (server/README.md "Recording VOYO on the server"; ./server/voyo-player.sh login once)
enabled = true
# the F1 live page in VOYO; "" = the page open when you last finished "voyo-player.sh login"
stream_url = ""

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>F1 TV · Access</title>
<link rel="stylesheet" href="/tv-static/tv.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: auto; }
  .card { width: min(720px, 94vw); background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 28px 32px; text-align: center; }
  .lbl { font-size: 14px; font-weight: 800; letter-spacing: .18em; color: var(--text-3); }
  h1 { font-size: clamp(26px, 4vw, 44px); font-weight: 900; letter-spacing: .06em; margin: 8px 0 14px; }
  .code { font-family: var(--mono); font-size: clamp(40px, 8vw, 84px); font-weight: 800; letter-spacing: .12em; color: var(--amber); margin: 10px 0; }
  .msg { font-size: clamp(15px, 1.8vw, 20px); font-weight: 700; color: var(--text-2); line-height: 1.45; }
  .msg.bad { color: var(--red); } .msg.ok { color: var(--green); }
  .bar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin: 18px 0 6px; }
  .bar > div { height: 100%; background: var(--amber); transition: width 1s linear; }
  button { font: inherit; font-size: 16px; font-weight: 900; letter-spacing: .08em; padding: 10px 18px; border-radius: 6px; border: 1px solid var(--text);
    background: var(--text); color: #111; cursor: pointer; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <div class="lbl">F1 TV · ACCESS REQUEST</div>
  <h1 id="title">ASKING FOR ACCESS…</h1>
  <div class="code" id="code">···-···</div>
  <div class="msg" id="msg">connecting to the server…</div>
  <div class="bar"><div id="bar" style="width:100%"></div></div>
  <button id="again" hidden>ASK AGAIN</button>
</div>
<script>
"use strict";
// The server decides everything: this page only asks for a request (the server keeps it and gives this
// browser a random secret in an HttpOnly cookie) and waits. The trusted /remote phone approves it; the
// server then sets the /tv session cookie. Nothing here can grant access by itself.
const $ = (id) => document.getElementById(id);
const next = (() => { const n = new URLSearchParams(location.search).get("next") || "/tv"; return /^\/[A-Za-z0-9_\-\/]*$/.test(n) && !n.startsWith("//") ? n : "/tv"; })();
let timer = null, total = 120;
function show(title, msg, cls) { $("title").textContent = title; $("msg").textContent = msg; $("msg").className = "msg " + (cls || ""); }
async function request() {
  clearTimeout(timer); $("again").hidden = true;
  let r, b;
  try { r = await fetch("/api/tv/auth/request", { method: "POST", credentials: "same-origin" }); b = await r.json(); }
  catch (e) { show("NO CONNECTION", "the F1 server is not reachable - retrying", "bad"); timer = setTimeout(request, 5000); return; }
  if (b.authenticated) { location.href = next; return; }
  if (!r.ok) { show("NOT NOW", b.error || "the request was refused", "bad"); $("again").hidden = false; return; }
  $("code").textContent = b.code; total = b.expires_in || 120;
  if (!b.approver_set) show("APPROVAL NEEDED", "No phone is set up to approve /tv yet: in /disk → SECURITY choose your /remote device (USE FOR AUTH), then ask again.", "bad");
  else show("APPROVE ON YOUR PHONE", `Open /remote on the trusted phone${b.approver_online ? "" : " (it is not connected right now)"} and approve the request with this code.`);
  poll();
}
async function poll() {
  let b;
  try { b = await (await fetch("/api/tv/auth/status", { cache: "no-store", credentials: "same-origin" })).json(); }
  catch (e) { timer = setTimeout(poll, 3000); return; }
  if (b.status === "authenticated") { show("APPROVED", "opening…", "ok"); location.href = next; return; }
  if (b.status === "pending") {
    $("bar").style.width = Math.max(0, b.expires_in / total * 100) + "%";
    timer = setTimeout(poll, 1500); return;
  }
  const why = { denied: ["DENIED", "the request was denied on the phone"], expired: ["EXPIRED", "nobody answered in time"],
    none: ["NO REQUEST", "the request is gone"] }[b.status] || ["NO ACCESS", b.status];
  show(why[0], why[1], "bad"); $("bar").style.width = "0"; $("again").hidden = false;
}
$("again").addEventListener("click", request);
request();
</script>
</body>
</html>

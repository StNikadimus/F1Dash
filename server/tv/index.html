<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>F1 TV</title>
<link rel="stylesheet" href="/tv-static/tv.css">
</head>
<body class="locked">
<!-- every load of /tv: the trusted phone approves THIS load first (server-side; nothing below starts before) -->
<div id="auth">
  <div class="card">
    <div class="lbl">F1 TV · ACCESS REQUEST</div>
    <h1 id="a-title">ASKING FOR ACCESS…</h1>
    <div class="code" id="a-code">···-···</div>
    <div class="msg" id="a-msg">connecting to the server…</div>
    <div class="bar"><div id="a-bar" style="width:100%"></div></div>
    <button id="a-again" hidden>ASK AGAIN</button>
  </div>
</div>

<!-- the dashboard (its own page, layout forced for this window only) - loaded only after the approval -->
<iframe id="dash" title="F1 dashboard"></iframe>

<!-- the server's live VOYO stream, laid over the dashboard's video slot -->
<div id="vbox">
  <video id="live" playsinline muted autoplay></video>
  <div id="offair">
    <div class="oa-main" id="oa-main">NO LIVE STREAM</div>
    <div class="oa-sub" id="oa-sub">connecting to the server…</div>
  </div>
  <button id="unmute" hidden>🔇 CLICK FOR SOUND</button>
  <!-- which source plays (LIVE / REPLAY) + a replay's position -->
  <div id="posd" hidden><span id="po-src" class="lv">● LIVE</span><span id="po-time"></span>
    <div id="po-prog" hidden><i id="po-bar"></i></div></div>
</div>

<!-- the player panel: LIVE, then a gallery of the recordings on the disk (one section per GP weekend), transport,
     volume - arrows / OK / BACK (remote or keys), or chosen on the phone (/remote VIDEOS) -->
<div id="pmenu" hidden tabindex="-1">
  <div class="pm-head"><span class="pm-t">PLAYER</span><span id="pm-src" class="lv">LIVE</span>
    <span class="pm-k">▲▼◀▶ choose · OK play · BACK close · or choose on the phone</span>
    <button id="pm-close" aria-label="Close the player panel">✕</button></div>
  <div id="pm-err"></div>
  <div id="pm-list"></div>
</div>

<!-- controls: one thin bar along the bottom of the video window, shown while the mouse is in the window's lower
     part (or on the bar), after a key and on a touch - the stream status (a label, not a button), the layout,
     the actions -->
<div id="ctl">
  <div class="ctl-group" id="layouts">
    <button data-l="RACE_VIEW" class="sel">RACE VIEW <kbd>1</kbd></button>
    <button data-l="VIDEO_FOCUS">VIDEO <kbd>2</kbd></button>
    <button data-l="FULL_DASHBOARD">DASHBOARD <kbd>3</kbd></button>
  </div>
  <div class="ctl-group" id="actions">
    <button id="b-player">LIVE / REPLAYS <kbd>B</kbd></button>
    <button id="b-sound">SOUND <kbd>M</kbd></button>
    <button id="b-full">FULLSCREEN <kbd>F</kbd></button>
    <button id="b-tok">LOG OUT</button>
    <a href="/disk" target="_blank" class="btn">RECORDER</a>
  </div>
  <div class="ctl-status" id="ctl-status" role="status" aria-live="polite">…</div>
</div>

<script src="/tv-static/vendor/hls.light.min.js"></script>
<script src="/tv-static/tv.js"></script>
</body>
</html>

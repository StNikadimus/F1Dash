# docker compose -f server/docker/docker-compose.yml up -d --build      (from the repository root)
services:
  f1-dashboard:
    build:
      context: ../..
      dockerfile: server/docker/Dockerfile
    container_name: f1-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: ../.env            # server/.env (copy server/.env.example) - optional
        required: false
    environment:
      TZ: "${TZ:-Europe/Ljubljana}"
    volumes:
      - ../../data:/data           # sign-in, sync state, F1-feed recordings, caches (shared with launch.sh)
      # VOYO stream recordings on another disk: mount it and point [voyo.recording] path at it
      # - /mnt/usb/f1-voyo:/voyo        (+ F1DASH_VOYO_RECORDING_PATH=/voyo in server/.env)

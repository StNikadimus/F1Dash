# Internet access to /tv and /remote through Tailscale Funnel (server/README.md "Public access").
# A systemd drop-in - nothing in the repository or in server/.env changes:
#   sudo mkdir -p /etc/systemd/system/f1-dashboard.service.d
#   sudo cp /opt/f1-dashboard/server/systemd/public-gateway.conf /etc/systemd/system/f1-dashboard.service.d/
#   sudo nano /etc/systemd/system/f1-dashboard.service.d/public-gateway.conf     # your hostname below
#   sudo systemctl daemon-reload && sudo systemctl restart f1-dashboard
# Off again: delete the file, daemon-reload, restart (and: sudo tailscale funnel --https=8443 off).
#
# The gateway listens on 127.0.0.1 only (Funnel's tailscaled is its client) and forwards nothing but /tv,
# /remote and what they need. With a wrong / empty hostname it does not start at all (fail closed).
[Service]
Environment=F1DASH_PUBLIC_ENABLED=true
# this machine's Tailscale name, exactly as `tailscale status --json | grep DNSName` shows it (no trailing dot)
Environment=F1DASH_PUBLIC_HOSTNAME=CHANGE-ME.your-tailnet.ts.net
# the local port Funnel forwards to: tailscale funnel --bg --https=8443 http://127.0.0.1:8090
Environment=F1DASH_PUBLIC_PORT=8090
